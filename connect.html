<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="site.css" />
</head>
<body class="connect-page">

  <div class="site-frame site-main is-ready">

    <header class="site-band site-band--header">
      <div class="section-inner section-inner--header">
        <a href="index.html" class="site-name">bess myers · content designer</a>
        <nav>
          <a href="work.html">Work</a>
          <a href="about.html">About</a>
          <a href="connect.html" aria-current="page">Connect</a>
        </nav>

    </header>

    <div class="hero site-band reveal is-visible">
      <div class="section-inner">
        <p class="section-label">Connect</p>
      </div>
    </div>

    <section class="site-band reveal">
      <div class="section-inner">
        <div class="connect-list">
          <a class="connect-row" href="/resume.pdf" target="_blank" rel="noopener">
            <span class="connect-title">Resume</span>

        <p class="footer-copy">© 2025 bess myers</p>
      </div>
    </footer>

  </div>

  <script>
    (function initReveal() {
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const blocks = document.querySelectorAll('.reveal:not(.is-visible)');

      if (prefersReduced) {
        blocks.forEach(function(el) { el.classList.add('is-visible'); });
        return;
      }

      const observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.08 });

      blocks.forEach(function(el) { observer.observe(el); });
    })();
  </script>

</body>
